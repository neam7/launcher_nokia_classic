# Release firmado al subir una etiqueta, por ejemplo v1.0.
# Para probar sin publicar: Actions > Release > Run workflow (compila y firma, no crea release).
# La versión de la etiqueta debe ser el versionName de app/build.gradle.kts.
# El release queda como BORRADOR: se publica a mano después de revisarlo.
# Usa dos Repository secrets: KEYSTORE_BASE64 y KEYSTORE_PASSWORD
# (a mano en Settings > Secrets and variables > Actions, o con scripts/setup_github_secrets.sh).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compila y prueba SIN acceso a las llaves.
  build:
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.app.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Revisar que la etiqueta coincida con la versión
        id: app
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          if [ "$EVENT" = push ] && [ "$TAG" != "v$version" ]; then
            echo "::error::La etiqueta $TAG no coincide con versionName $version"
            exit 1
          fi
          echo "title=Nokia Launcher $version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Probar y compilar sin firmar
        run: |
          bash ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease --no-configuration-cache
          mkdir unsigned
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/bundle/release/app-release.aab unsigned/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: unsigned/
          if-no-files-found: error
          retention-days: 1

  # Firma y crea el borrador. No ejecuta Gradle ni ninguna dependencia del proyecto.
  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Firmar
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          UNSIGNED: ${{ runner.temp }}/unsigned
          OUT: ${{ runner.temp }}/signed
          KEYSTORE: ${{ runner.temp }}/release.jks
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Faltan los Repository secrets KEYSTORE_BASE64 y KEYSTORE_PASSWORD."
            exit 1
          fi
          trap 'rm -f "$KEYSTORE"' EXIT
          (umask 077; printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE")
          ./scripts/build_android_aab.sh
          cd "$OUT" && sha256sum *.apk > SHA256SUMS.txt

      # Para descargar y probar. A la gente se le entrega el APK; el AAB solo sirve para una tienda.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmado
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 5

      - name: Crear el release en borrador
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ needs.build.outputs.title }}
          OUT: ${{ runner.temp }}/signed
        run: |
          gh release create "$TAG" "$OUT"/*.apk "$OUT/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TITLE" \
            --notes "App gratuita para Android 12 o posterior. No es un producto oficial de Nokia."
